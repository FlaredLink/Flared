# SPDX-License-Identifier: AGPL-3.0-only
# Publishes @flaredlink/cli to npm when a maintainer pushes a tag such as cli-v0.1.0. npm trusted
# publishing (OIDC) authenticates the run, so no npm token is stored, and npm adds provenance.
name: Release CLI

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # A release builds from a clean install, never from a shared cache.
          package-manager-cache: false
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "cli-v$version" = "$GITHUB_REF_NAME"
      - run: bunx tsc --noEmit
      - run: bun run test:cli
      - run: bun run build:cli
      # The bundle contains the workspace packages, so their workspace: specifiers are not published.
      - run: npm pkg delete devDependencies scripts
        working-directory: packages/cli
      - run: npm publish --access public
        working-directory: packages/cli
