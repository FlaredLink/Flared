# SPDX-License-Identifier: AGPL-3.0-only
# Checks every push and pull request from a fresh checkout: types, formatting, the Workers/D1
# tests, and a standalone build with a Wrangler dry run, as Deploy on Cloudflare builds it.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:cli
      - run: bun run test:standalone
      - run: bun run build:dry-run
