<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#c94b00" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- Applies a saved Light or Dark choice before the first paint (@flared/ui/theme/ThemeControl.svelte). -->
		<script>
			try {
				var m = document.cookie.match(/(?:^|;\s*)theme=(light|dark)(?:;|$)/);
				if (m) document.documentElement.dataset.mode = m[1];
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
